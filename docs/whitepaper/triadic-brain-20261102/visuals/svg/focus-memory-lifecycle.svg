<style>g.edge text, g.edge-labels text { paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }</style><desc>Required minimized custody, optional retention, retrieval and current use are different operations. A recommendation or retrieved packet is not a storage transaction or permission to inject context. No edge from custody directly to optional memory exists: custody does not supply blanket PMR, context-injection or training permission. Training and persistent model/profile updates are outside this flow and need separate authorization. Native durable retention and complete dependency-aware lifecycle integration are not established by the source edition. Revocation cannot guarantee erasure of already disclosed copies; a hash-only record cannot replay missing content.</desc>
