<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">Prior comparison: existing source and the separate missing native join</title><desc id="desc">Explicitly supplied prior declarations feed an existing pure comparator. A proposed native same-custody authorized retention and use consumer is an unmerged unqualified draft. No lookup, durable memory, credential authentication or provider-context injection is created by the pure comparator. Same-root role synthesis is separate from cross-task memory.</desc>
<rect width="1600" height="850" fill="white"/>
<defs>
<marker id="arrow-data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#087f8c"/></marker>
<marker id="arrow-control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a5b06"/></marker>
<marker id="arrow-provenance" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7451a8"/></marker>
<marker id="arrow-association" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#71808b"/></marker>
</defs><g font-family="DejaVu Sans, sans-serif">
<text x="44" y="40" font-size="15" fill="#087f8c" text-anchor="start" font-weight="700">SOURCE STATUS BOUNDARY</text>
<text x="44" y="86" font-size="32" fill="#172b3a" text-anchor="start" font-weight="700">Prior comparison is not a memory transaction</text>
<text x="44" y="122.0" font-size="18" fill="#465b6c" text-anchor="start">A working pure leaf and a native custody/current-use connection must not be collapsed into one completed memory feature.</text>
<rect x="44" y="240" width="392" height="150" rx="10" fill="#edf7f5" stroke="#80a99d" stroke-width="1.5"/>
<text x="62" y="267" font-size="14" fill="#465b6c" text-anchor="start" font-weight="700">F14 · F84 reference</text>
<text x="62" y="303.0" font-size="21" fill="#172b3a" text-anchor="start" font-weight="700">Explicitly supplied prior</text>
<text x="62" y="331.35" font-size="21" fill="#172b3a" text-anchor="start" font-weight="700">declarations</text>
<text x="62" y="354" font-size="14" fill="#465b6c" text-anchor="start">supplied bytes, not automatic lookup</text>
<rect x="574" y="240" width="392" height="150" rx="10" fill="#edf7f5" stroke="#80a99d" stroke-width="1.5"/>
<text x="592" y="267" font-size="14" fill="#465b6c" text-anchor="start" font-weight="700">F14 · source-connected</text>
<text x="592" y="303.0" font-size="21" fill="#172b3a" text-anchor="start" font-weight="700">Pure comparison result</text>
<text x="592" y="354" font-size="14" fill="#465b6c" text-anchor="start">duplicate / related / conflict / unknown</text>
<rect x="1104" y="240" width="392" height="150" rx="10" fill="#fff8ed" stroke="#b99761" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1122" y="267" font-size="14" fill="#465b6c" text-anchor="start" font-weight="700">F13 · F35 · F81</text>
<text x="1122" y="303.0" font-size="21" fill="#172b3a" text-anchor="start" font-weight="700">Native same-custody</text>
<text x="1122" y="331.35" font-size="21" fill="#172b3a" text-anchor="start" font-weight="700">consumer</text>
<text x="1122" y="354" font-size="14" fill="#465b6c" text-anchor="start">unmerged, unqualified draft</text>
<path d="M442,340 L564,340" fill="none" stroke="#087f8c" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<text x="454" y="277" font-size="14" fill="#087f8c" text-anchor="start">bounded</text>
<text x="454" y="295" font-size="14" fill="#087f8c" text-anchor="start">comparison</text>
<path d="M972,340 L1094,340" fill="none" stroke="#9a5b06" stroke-width="2.7" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-control)"/>
<text x="984" y="265" font-size="14" fill="#9a5b06" text-anchor="start">draft</text>
<text x="984" y="283" font-size="14" fill="#9a5b06" text-anchor="start">authorized</text>
<text x="984" y="301" font-size="14" fill="#9a5b06" text-anchor="start">join</text>
<text x="44" y="452" font-size="17" fill="#087f8c" text-anchor="start" font-weight="700">SOLID: INSPECTED SOURCE CONNECTION</text>
<text x="820" y="452" font-size="17" fill="#9a5b06" text-anchor="start" font-weight="700">DASHED: DRAFT JOIN, NOT INSTALLED</text>
<rect x="44" y="493" width="1512" height="230" rx="10" fill="#f5f7f9" stroke="#becbd3" stroke-width="1.5"/>
<text x="66" y="530" font-size="21" fill="#172b3a" text-anchor="start" font-weight="700">Keep these boundaries visible</text>
<text x="66" y="570" font-size="17" fill="#465b6c" text-anchor="start">• The comparator performs no lookup, persistence, grant authentication, context injection or dispatch.</text>
<text x="66" y="600" font-size="17" fill="#465b6c" text-anchor="start">• The current ordinary cognitive route passes no PMR consent; reference examples are no-write or in-memory.</text>
<text x="66" y="630" font-size="17" fill="#465b6c" text-anchor="start">• Current grants, original / producer / target bindings, audit and retained effects belong at the real native owner.</text>
<text x="66" y="660" font-size="17" fill="#465b6c" text-anchor="start">• Same-root Analyst → Challenge → Synthesis is already separate source work, not proof of cross-task memory.</text>
<text x="66" y="690" font-size="17" fill="#465b6c" text-anchor="start">• No second controller or replacement core is introduced by this visual.</text>
<text x="44" y="793" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">This comparison status is a scoped source review, not a benchmark, live-provider demonstration or installed qualification.</text>
</g></svg>
