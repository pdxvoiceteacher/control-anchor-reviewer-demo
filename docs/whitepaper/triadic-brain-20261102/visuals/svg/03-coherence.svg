<text x="44" y="1245" font-size="17" fill="#465b6c" text-anchor="start">• These lanes are a proposed composition of preserved contracts, not an implemented pipeline.</text>
<text x="44" y="1273" font-size="17" fill="#465b6c" text-anchor="start">• Analogy is a falsifiable proposal, not physical unification or universal semantic equivalence.</text>
<text x="44" y="1301" font-size="17" fill="#465b6c" text-anchor="start">• No adequate mapping, inapplicability, missing evidence and lost discrimination remain distinct.</text>
