<text x="44" y="40" font-size="15" fill="#087f8c" text-anchor="start" font-weight="700">STATIC SOURCE TRACE · NOT INSTALLED OR LIVE EVIDENCE</text>
<text x="44" y="86" font-size="32" fill="#172b3a" text-anchor="start" font-weight="700">The cognitive route already connected in source</text>
<text x="44" y="122.0" font-size="18" fill="#465b6c" text-anchor="start">Solid arrows below identify inspected callers and accepting consumers. They do not claim deployed inference or complete end-to-end</text>
<text x="44" y="146.3" font-size="18" fill="#465b6c" text-anchor="start">usefulness.</text>
<text x="44" y="176" font-size="17" fill="#465b6c" text-anchor="start" font-weight="700">Work submission, provider dispatch, evaluator acceptance and human review are distinct transitions—not one automatic run.</text>
