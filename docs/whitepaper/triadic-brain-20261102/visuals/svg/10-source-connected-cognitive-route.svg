<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1660" viewBox="0 0 1600 1660" role="img" aria-labelledby="title desc"><title id="title">Maintained cognitive route: actual source connections</title><desc id="desc">Static source inspection identified the maintained WORK, separate DISPATCH, JOINED analysis, credentialed evaluator, custody acceptance, Atlas, TEL and Home inspection routes. Solid arrows mean a caller and accepting consumer are present in the inspected source, not live execution, installed qualification or human acceptance. Capture-only explicitly records optional analysis not executed. Ordinary governed processing passes no PMR consent.</desc>
