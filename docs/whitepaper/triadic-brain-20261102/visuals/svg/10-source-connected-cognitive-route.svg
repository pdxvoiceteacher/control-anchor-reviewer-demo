<text x="66" y="1400" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">WHAT THIS SOURCE TRACE DOES NOT ESTABLISH</text>
<text x="66" y="1434" font-size="17" fill="#465b6c" text-anchor="start">• CAPTURE_ONLY explicitly marks optional Coherence / Sophia / Atlas / TEL analysis NOT_EXECUTED.</text>
<text x="66" y="1464" font-size="17" fill="#465b6c" text-anchor="start">• The ordinary governed route passes no PMR consent: required custody is not optional cognitive memory.</text>
<text x="66" y="1494" font-size="17" fill="#465b6c" text-anchor="start">• Synthetic captured responses and injected boundaries are not installed provider inference or human acceptance.</text>
<text x="66" y="1524" font-size="17" fill="#465b6c" text-anchor="start">• The full source edge ledger retains separate same-root role synthesis, reconstruction and comparison boundaries.</text>
<text x="44" y="1612" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">Source-connected ≠ execution-tested ≠ installed ≠ human accepted. Exact private source anchors are retained separately.</text>
