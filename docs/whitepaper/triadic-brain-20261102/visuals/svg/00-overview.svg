<text x="68" y="550" font-size="14" fill="#087f8c" text-anchor="start" font-weight="700">TASK</text>
<text x="372" y="550" font-size="14" fill="#087f8c" text-anchor="start" font-weight="700">FINITE PROPOSAL</text>
<text x="676" y="550" font-size="14" fill="#087f8c" text-anchor="start" font-weight="700">FIXED CANDIDATE</text>
<text x="980" y="550" font-size="14" fill="#087f8c" text-anchor="start" font-weight="700">ATTRIBUTED REVIEW</text>
<text x="1284" y="550" font-size="14" fill="#087f8c" text-anchor="start" font-weight="700">READABLE RESULT</text>
<path d="M1420,324 L1420,194 L440,194" fill="none" stroke="#087f8c" stroke-width="2.7" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-data)"/>
<text x="685" y="181" font-size="17" fill="#087f8c" text-anchor="start" font-weight="700">reviewed result / orientation / available recourse</text>
<path d="M420,666 L420,574 L622,574 L622,525" fill="none" stroke="#9a5b06" stroke-width="2.7" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-control)"/>
<text x="445" y="622" font-size="16" fill="#9a5b06" text-anchor="start">scope at every deciding consumer</text>
<path d="M1230,525 L1230,645" fill="none" stroke="#7451a8" stroke-width="2.7" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-provenance)"/>
<text x="850" y="602" font-size="16" fill="#7451a8" text-anchor="start">attempt / input / stage / outcome records</text>
<a xlink:href="../modules/M07.md">
<rect x="68" y="666" width="708" height="206" rx="10" fill="#fff8ee" stroke="#c69b5c" stroke-width="1.5"/>
<text x="90" y="699" font-size="18" fill="#9a5b06" text-anchor="start" font-weight="700">M07 · UCC / AEGIS / moralWARE / CONTROLS</text>
<text x="90" y="736.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">Each deciding consumer enforces its current scope:</text>
<text x="90" y="763.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">intake, dispatch, peers, retention and release.</text>
<text x="90" y="816.0" font-size="17" fill="#465b6c" text-anchor="start">Advisory business findings do not veto ordinary prompts. Rights</text>
<text x="90" y="838.95" font-size="17" fill="#465b6c" text-anchor="start">review, technical protection and recourse stay distinct.</text>
</a>
<a xlink:href="../modules/M06.md">
<rect x="820" y="666" width="708" height="206" rx="10" fill="#f5f1fb" stroke="#a88bc7" stroke-width="1.5"/>
<text x="842" y="699" font-size="18" fill="#7451a8" text-anchor="start" font-weight="700">M06 · TEL / TAC / CUSTODY / PROVENANCE</text>
<text x="842" y="736.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">Records span the workflow, not just review. Custody</text>
<text x="842" y="763.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">owns history; TEL organizes explicit stage links.</text>
<text x="842" y="816.0" font-size="17" fill="#465b6c" text-anchor="start">TAC constrains permitted observation. Lineage and replay preserve</text>
<text x="842" y="838.95" font-size="17" fill="#465b6c" text-anchor="start">unknowns. Required custody is not optional memory.</text>
</a>
<text x="68" y="919" font-size="16" fill="#465b6c" text-anchor="start" font-weight="700">SEPARATE SUPPORTING ROUTES · NOT MANDATORY PREREQUISITES FOR EVERY LOCAL TASK</text>
<a xlink:href="../modules/M08.md">
<rect x="68" y="942" width="708" height="198" rx="10" fill="#f4f7fa" stroke="#becbd3" stroke-width="1.5"/>
<text x="90" y="975" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">M08 · OWNER-GOVERNED PEERS / RESOURCES / PROVIDERS</text>
<text x="90" y="1014.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">Connects to M01 intake, M02 roles and M04 review</text>
<text x="90" y="1041.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">through explicit owner admission.</text>
<text x="90" y="1090.0" font-size="17" fill="#465b6c" text-anchor="start">Remote grants do not grant local current use. Real two/three-node</text>
<text x="90" y="1112.95" font-size="17" fill="#465b6c" text-anchor="start">cognition is not established by these diagrams.</text>
</a>
<a xlink:href="../modules/M09.md">
<rect x="820" y="942" width="708" height="198" rx="10" fill="#f4f7fa" stroke="#becbd3" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="842" y="975" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">M09 · RESEARCH / QUALITY / OPTIONAL EXTENSIONS</text>
<text x="842" y="1014.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">Connects to planning, typed representation and</text>
<text x="842" y="1041.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">review through bounded comparisons and</text>
<text x="842" y="1068.0" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">source-specific contracts.</text>
<text x="842" y="1090.0" font-size="17" fill="#465b6c" text-anchor="start">No invented benchmark, completion percentage, mandatory research</text>
<text x="842" y="1112.95" font-size="17" fill="#465b6c" text-anchor="start">organ or automatic permission upgrade.</text>
</a>
<text x="68" y="1177" font-size="17" fill="#465b6c" text-anchor="start" font-weight="700">Historical register only: F02 integration lineage · F79 TCHES testing document. Neither is a missing runtime organ.</text>
<text x="44" y="1231" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">Arrows above are declared intended flows. Static-source caller evidence is shown separately in the source-path view.</text>
<text x="44" y="1273" font-size="16" fill="#465b6c" text-anchor="start">Primary homes are navigational groupings, not a claim of current service ownership. Open a module for its typed records and evidence limits.</text>
<text x="44" y="1298" font-size="16" fill="#465b6c" text-anchor="start">Reference, profile, contract, principle, research, historical record and capability are not interchangeable kinds.</text>
</g></svg>
