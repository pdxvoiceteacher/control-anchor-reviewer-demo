<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1330" viewBox="0 0 1600 1330" role="img" aria-labelledby="title desc"><title id="title">Triadic Brain: responsibility and connection map</title><desc id="desc">A layered intended architecture. Human task enters Control Anchor and Sonya, then finite executive planning, CoherenceLattice analysis, Sophia review and Atlas orientation. User controls and custody/provenance crosscut this loop. Independent peer/provider integration and optional research are separate supporting branches. All module groupings are editorial; arrows are intended data/control/provenance relationships, not installed integration proof. F02 lineage and F79 TCHES historical testing document are outside capability diagrams. Every registry ID is indexed once by primary home.</desc>
