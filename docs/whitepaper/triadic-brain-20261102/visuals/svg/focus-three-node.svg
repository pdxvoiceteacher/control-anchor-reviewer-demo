<style>g.edge text { paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }</style><desc>An illustrative requester, candidate contributor and reviewer cooperate through separate owner decisions. Roles are illustrative; no node is a sovereign global evaluator and no shared global memory is implied. Actual two-node exchange and three-node Wi-Fi cognition remain unproved in the source edition; synthetic peer components do not establish this deployment. Each node retains local control, resources, custody and permitted disclosure; no shared account, unlimited global RAM or universally writable drive is implied. Cognitive roles may be placed differently; A/B/C placement is an explicitly illustrative architecture proposal, not a mandated deployment or proof of physical independence. F38 confidential release is optional design work with a specific key-owner/hardware boundary; ordinary transport security is not proof against a hostile privileged host. No direct Node B-to-Node C transfer is shown: the candidate is admitted locally and separately authorized for the reviewer audience. F79 is absent: it is a historical testing document, not a Brain capability or a heat-system implementation roadmap.</desc>
