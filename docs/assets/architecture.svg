<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="white"/><text x="30" y="42" font-family="sans-serif" font-size="29" font-weight="bold" fill="#132b41">The proposed product architecture</text><text x="30" y="76" font-family="sans-serif" font-size="19" fill="#40566a">Proposed requirements, not a completed live workflow</text><rect x="30" y="105" width="1140" height="87" rx="8" fill="#eaf2f8" stroke="#c3ced8"/><text x="52" y="136" font-family="sans-serif" font-size="22" font-weight="bold" fill="#132b41">Human authority and understandable controls</text><text x="52" y="167" font-family="sans-serif" font-size="19" fill="#20384d">Goals, sources and permissions | Text, graph and database views of one accepted definition</text><rect x="30" y="210" width="1140" height="87" rx="8" fill="#eaf2f8" stroke="#c3ced8"/><text x="52" y="241" font-family="sans-serif" font-size="22" font-weight="bold" fill="#132b41">Bounded executive coordination</text><text x="52" y="272" font-family="sans-serif" font-size="19" fill="#20384d">Goal state and checkpoints | Supported BYO models | Worker limits and stopping conditions</text><rect x="30" y="315" width="1140" height="87" rx="8" fill="#eaf2f8" stroke="#c3ced8"/><text x="52" y="346" font-family="sans-serif" font-size="22" font-weight="bold" fill="#132b41">Grounded work and inspectable correction</text><text x="52" y="377" font-family="sans-serif" font-size="19" fill="#20384d">Analysis and challenge | Linked revisions | Actual outcomes and retained evidence</text><rect x="30" y="420" width="1140" height="87" rx="8" fill="#f3f0fa" stroke="#c3ced8"/><text x="52" y="451" font-family="sans-serif" font-size="22" font-weight="bold" fill="#132b41">Separately optional extensions</text><text x="52" y="482" font-family="sans-serif" font-size="19" fill="#20384d">Eligible PMR priors | Sonya peer exchange and compute | Opt-in learning and research</text></svg>